name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # objdiff-cli from https://github.com/encounter/objdiff/releases, pinned with its SHA-256.
  OBJDIFF_VERSION: v3.8.3
  OBJDIFF_SHA256: e823ae932a56c68dcd86b68d12f2268c953e0c027402162c8a6dfa6a00d65008

jobs:
  build:
    name: Build ${{ matrix.version }}
    # Pinned: the original objects were built with Ubuntu 24.04's PowerPC GCC.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [us, eu]
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-powerpc-linux-gnu ninja-build

      - name: Download objdiff-cli
        run: |
          curl -fsSL -o "$RUNNER_TEMP/objdiff-cli" \
            "https://github.com/encounter/objdiff/releases/download/$OBJDIFF_VERSION/objdiff-cli-linux-x86_64"
          echo "$OBJDIFF_SHA256  $RUNNER_TEMP/objdiff-cli" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/objdiff-cli"

      - name: Configure
        run: python3 configure.py --version "$VERSION"

      - name: Build and check
        run: ninja

      - name: Generate the progress report
        run: |
          "$RUNNER_TEMP/objdiff-cli" report generate -o "build/$VERSION/report.json"

      # The artifact name is the version id plus _report, and its zip holds report.json.
      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
          if-no-files-found: error
